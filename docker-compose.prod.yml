services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - avs-frontend
      - workforce-frontend
      - workforce-backend
      - chatwoot
      - evolution-api
      - evolution-manager
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      DOMAIN: ${DOMAIN:-advancedvirtualsolutions.com}
      WFM_DOMAIN: ${WFM_DOMAIN:-wfm.advancedvirtualsolutions.com}
      API_DOMAIN: ${API_DOMAIN:-api.advancedvirtualsolutions.com}
      CHATWOOT_DOMAIN: ${CHATWOOT_DOMAIN:-chat.advancedvirtualsolutions.com}
      EVOLUTION_MANAGER_DOMAIN: ${EVOLUTION_MANAGER_DOMAIN:-evolution.advancedvirtualsolutions.com}
      EVOLUTION_PUBLIC_API_DOMAIN: ${EVOLUTION_PUBLIC_API_DOMAIN:-evolution-api.advancedvirtualsolutions.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

  avs-frontend:
    build:
      context: ./avs-frontend
      args:
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN:-advancedvirtualsolutions.com}
        NEXT_PUBLIC_CALENDLY_URL: ${NEXT_PUBLIC_CALENDLY_URL}
        NEXT_PUBLIC_WHATSAPP_URL: ${NEXT_PUBLIC_WHATSAPP_URL}
    restart: unless-stopped
    expose:
      - "3001"
    networks:
      - web

  workforce-frontend:
    build:
      context: ./workforce-frontend
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:-api.advancedvirtualsolutions.com}
        NEXT_PUBLIC_SCREEN_MONITOR_WS_URL: wss://${API_DOMAIN:-api.advancedvirtualsolutions.com}/screen-monitor
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - web

  workforce-backend:
    build:
      context: ./workforce-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE}?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      MFA_ENCRYPTION_SECRET: ${MFA_ENCRYPTION_SECRET}
      MFA_REQUIRED: ${MFA_REQUIRED:-true}
      MFA_ISSUER: ${MFA_ISSUER:-ShiftSync}
      SCREEN_MONITOR_ADMIN_KEY: ${SCREEN_MONITOR_ADMIN_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_ALERT_TIMEZONE: ${TELEGRAM_ALERT_TIMEZONE:-Africa/Lagos}
    expose:
      - "5000"
    networks:
      - web
      - data

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongo_data:/data/db
    networks:
      - data

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatwoot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      EVOLUTION_POSTGRES_DB: ${EVOLUTION_POSTGRES_DB:-evolution}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-evolution-db.sh:/docker-entrypoint-initdb.d/10-init-evolution-db.sh:ro
    networks:
      - data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - data

  chatwoot:
    image: chatwoot/chatwoot:${CHATWOOT_IMAGE_TAG:-latest-ce}
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment: &chatwoot_env
      RAILS_ENV: production
      NODE_ENV: production
      INSTALLATION_ENV: docker
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
      FRONTEND_URL: https://${CHATWOOT_DOMAIN:-chat.advancedvirtualsolutions.com}
      DEFAULT_LOCALE: en
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DB:-chatwoot}
      POSTGRES_USERNAME: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ENABLE_ACCOUNT_SIGNUP: ${CHATWOOT_ENABLE_ACCOUNT_SIGNUP:-false}
      FORCE_SSL: "true"
      RAILS_LOG_TO_STDOUT: "true"
    command: bundle exec rails s -p 3000 -b 0.0.0.0
    expose:
      - "3000"
    volumes:
      - chatwoot_storage:/app/storage
    networks:
      - web
      - data

  chatwoot-worker:
    image: chatwoot/chatwoot:${CHATWOOT_IMAGE_TAG:-latest-ce}
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      <<: *chatwoot_env
    command: bundle exec sidekiq -C config/sidekiq.yml
    volumes:
      - chatwoot_storage:/app/storage
    networks:
      - data

  evolution-api:
    image: evoapicloud/evolution-api:${EVOLUTION_IMAGE_TAG:-v2.3.0}
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "${EVOLUTION_BIND_ADDRESS:-127.0.0.1}:${EVOLUTION_PORT:-8080}:8080"
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-https://evolution-api.advancedvirtualsolutions.com}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${EVOLUTION_POSTGRES_DB:-evolution}
      DATABASE_CONNECTION_CLIENT_NAME: evolution_api
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution_api
      CACHE_LOCAL_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - web
      - data

  evolution-manager:
    image: evoapicloud/evolution-manager:${EVOLUTION_MANAGER_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - evolution-api
    expose:
      - "80"
    volumes:
      - ./deploy/evolution-manager/nginx.conf:/etc/nginx/conf.d/nginx.conf:ro
    networks:
      - web

networks:
  web:
  data:

volumes:
  caddy_data:
  caddy_config:
  mongo_data:
  postgres_data:
  redis_data:
  chatwoot_storage:
  evolution_instances:
