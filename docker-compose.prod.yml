services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - avs-frontend
      - workforce-frontend
      - workforce-backend
      - chatwoot
      - twilio-voice-router
      - livekit
      - livekit-token-server
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      DOMAIN: ${DOMAIN:-advancedvirtualsolutions.com}
      WFM_DOMAIN: ${WFM_DOMAIN:-wfm.advancedvirtualsolutions.com}
      API_DOMAIN: ${API_DOMAIN:-api.advancedvirtualsolutions.com}
      CHATWOOT_DOMAIN: ${CHATWOOT_DOMAIN:-chat.advancedvirtualsolutions.com}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:-livekit.advancedvirtualsolutions.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

  avs-frontend:
    build:
      context: ./avs-frontend
      args:
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN:-advancedvirtualsolutions.com}
        NEXT_PUBLIC_CALENDLY_URL: ${NEXT_PUBLIC_CALENDLY_URL}
        NEXT_PUBLIC_WHATSAPP_URL: ${NEXT_PUBLIC_WHATSAPP_URL}
        NEXT_PUBLIC_LIVEKIT_WS_URL: wss://${LIVEKIT_DOMAIN:-livekit.advancedvirtualsolutions.com}
    restart: unless-stopped
    expose:
      - "3001"
    networks:
      - web

  workforce-frontend:
    build:
      context: ./workforce-frontend
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:-api.advancedvirtualsolutions.com}
        NEXT_PUBLIC_SCREEN_MONITOR_WS_URL: wss://${API_DOMAIN:-api.advancedvirtualsolutions.com}/screen-monitor
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - web

  workforce-backend:
    build:
      context: ./workforce-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE}?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      MFA_ENCRYPTION_SECRET: ${MFA_ENCRYPTION_SECRET}
      MFA_REQUIRED: ${MFA_REQUIRED:-true}
      MFA_ISSUER: ${MFA_ISSUER:-ShiftSync}
      SCREEN_MONITOR_ADMIN_KEY: ${SCREEN_MONITOR_ADMIN_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_ALERT_TIMEZONE: ${TELEGRAM_ALERT_TIMEZONE:-Africa/Lagos}
    expose:
      - "5000"
    networks:
      - web
      - data

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongo_data:/data/db
    networks:
      - data

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatwoot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - data

  chatwoot:
    image: workforce-chatwoot-voice:${CHATWOOT_IMAGE_TAG:-latest-ce}
    build:
      context: ./chatwoot-custom
      args:
        CHATWOOT_IMAGE_TAG: ${CHATWOOT_IMAGE_TAG:-latest-ce}
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment: &chatwoot_env
      RAILS_ENV: production
      NODE_ENV: production
      INSTALLATION_ENV: docker
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
      FRONTEND_URL: https://${CHATWOOT_DOMAIN:-chat.advancedvirtualsolutions.com}
      DEFAULT_LOCALE: en
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DB:-chatwoot}
      POSTGRES_USERNAME: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ENABLE_ACCOUNT_SIGNUP: ${CHATWOOT_ENABLE_ACCOUNT_SIGNUP:-false}
      FORCE_SSL: "true"
      RAILS_LOG_TO_STDOUT: "true"
    command: bundle exec rails s -p 3000 -b 0.0.0.0
    expose:
      - "3000"
    volumes:
      - chatwoot_storage:/app/storage
    networks:
      - web
      - data

  chatwoot-worker:
    image: workforce-chatwoot-voice:${CHATWOOT_IMAGE_TAG:-latest-ce}
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      <<: *chatwoot_env
    command: bundle exec sidekiq -C config/sidekiq.yml
    volumes:
      - chatwoot_storage:/app/storage
    networks:
      - data

  twilio-voice-router:
    build:
      context: ./twilio-voice-router
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PORT: 4800
      PUBLIC_BASE_URL: https://${CHATWOOT_DOMAIN:-chat.advancedvirtualsolutions.com}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DB:-chatwoot}
      POSTGRES_USERNAME: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CHATWOOT_API_URL: https://${CHATWOOT_DOMAIN:-chat.advancedvirtualsolutions.com}
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID:-}
      CHATWOOT_BOT_ACCESS_TOKEN: ${CHATWOOT_BOT_ACCESS_TOKEN:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_TOKEN_API_KEY: ${TWILIO_TOKEN_API_KEY:-}
      TWILIO_TWIML_APP_SID: ${TWILIO_TWIML_APP_SID:-}
      TWILIO_CALLER_ID: ${TWILIO_CALLER_ID:-}
    expose:
      - "4800"
    networks:
      - web
      - data

  livekit:
    image: livekit/livekit-server:${LIVEKIT_IMAGE_TAG:-v1.9}
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    ports:
      - "${LIVEKIT_BIND_ADDRESS:-127.0.0.1}:${LIVEKIT_CONTROL_PORT:-7801}:7880"
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_RTC_UDP_PORT:-7882}:7882/udp"
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    networks:
      - web

  livekit-token-server:
    build:
      context: ./livekit-token-server
    restart: unless-stopped
    depends_on:
      - livekit
    environment:
      PORT: 4810
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_PUBLIC_URL: wss://${LIVEKIT_DOMAIN:-livekit.advancedvirtualsolutions.com}
      LIVEKIT_AGENT_VIDEO_BASE_URL: https://${DOMAIN:-advancedvirtualsolutions.com}/live-video
      CHATWOOT_API_URL: https://${CHATWOOT_DOMAIN:-chat.advancedvirtualsolutions.com}
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID:-}
      CHATWOOT_API_INBOX_ID: ${CHATWOOT_API_INBOX_ID:-}
      CHATWOOT_BOT_ACCESS_TOKEN: ${CHATWOOT_BOT_ACCESS_TOKEN:-}
    expose:
      - "4810"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - web

networks:
  web:
  data:

volumes:
  caddy_data:
  caddy_config:
  mongo_data:
  postgres_data:
  redis_data:
  chatwoot_storage:
