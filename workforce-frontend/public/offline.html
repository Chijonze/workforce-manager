<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <title>Offline · ShiftSync</title>
    <style>
      :root {
        color-scheme: light;
        --navy: #101820;
        --ink: #17212b;
        --muted: #66717c;
        --line: #dbe3e8;
        --teal: #0d9488;
        --bg: #f4f7f8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding:
          calc(28px + env(safe-area-inset-top))
          calc(20px + env(safe-area-inset-right))
          calc(28px + env(safe-area-inset-bottom))
          calc(20px + env(safe-area-inset-left));
        background: linear-gradient(180deg, #eef4f6 0%, var(--bg) 320px);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(440px, 100%);
        padding: 28px 24px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 14px 40px rgba(23, 33, 43, 0.08);
        text-align: center;
      }

      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        border-radius: 15px;
        background: var(--navy);
        display: grid;
        place-items: center;
      }

      .mark img { width: 52px; height: 52px; display: block; }

      h1 { margin: 0 0 8px; font-size: 21px; }

      p { margin: 0 0 18px; color: var(--muted); font-size: 14.5px; line-height: 1.55; }

      button {
        width: 100%;
        min-height: 46px;
        border: 0;
        border-radius: 9px;
        background: var(--teal);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .note { margin: 16px 0 0; font-size: 12px; color: #8a949d; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <img src="/icons/icon-192.png" alt="" />
      </div>
      <h1>You're offline</h1>
      <p>
        ShiftSync needs a connection to load workforce data, attendance and monitoring.
        Any work you had open is safe, but new data cannot be fetched until you reconnect.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
      <p class="note">Only the app shell is cached on this device — private workforce data is never stored offline.</p>
    </main>
  </body>
</html>
