name: Build Mac Screen Monitor

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "employee-screen-monitor/**"
      - ".github/workflows/build-mac-screen-monitor.yml"

concurrency:
  group: build-mac-screen-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS DMG (${{ matrix.name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm
            build-flag: --arm64
          - name: regular
            build-flag: --x64
    defaults:
      run:
        working-directory: employee-screen-monitor
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: employee-screen-monitor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG
        run: npx electron-builder --mac dmg ${{ matrix.build-flag }}

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: workforce-screen-monitor-mac-dmg-${{ matrix.name }}
          path: employee-screen-monitor/dist/*.dmg
          if-no-files-found: error
